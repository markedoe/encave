name: Mac screens probe (temporary)

on:
  push:
    branches: ["claude/mac-screens"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Select newest Xcode
        working-directory: .
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
      - name: Build the Mac app
        run: |
          set -o pipefail
          brew install xcodegen xcbeautify
          xcodegen generate
          xcodebuild build -project Encave.xcodeproj -scheme EncaveMac -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            | xcbeautify --renderer github-actions
      - name: Which launches spin (debug)
        run: |
          app="$RUNNER_TEMP/dd/Build/Products/Release/Encave.app/Contents/MacOS/Encave"
          try() {
            label=$1; shift
            "$app" "$@" > "$RUNNER_TEMP/try.log" 2>&1 &
            pid=$!
            sleep 20
            echo "== $label: cpu $(ps -o %cpu= -p $pid), windows: $(osascript -e 'tell application "System Events" to count windows of (first process whose unix id is '"$pid"')' 2>&1)"
            grep encave-screenshots "$RUNNER_TEMP/try.log" | head -5
            sample "$pid" 2 -file "$RUNNER_TEMP/s.txt" >/dev/null 2>&1
            grep -cE 'MacRoot.body.getter' "$RUNNER_TEMP/s.txt" || true
            kill $pid; wait $pid 2>/dev/null; sleep 2
          }
          try "empty"
          try "sample" -ApplePersistenceIgnoreState YES --sample-data
          try "sample racks" --tab racks -ApplePersistenceIgnoreState YES --sample-data
          try "sample screenshots" -EncaveScreenshots YES -ApplePersistenceIgnoreState YES --sample-data
      - name: Screenshots
        run: tools/mac-screenshots.sh "$RUNNER_TEMP/dd/Build/Products/Release/Encave.app" "$RUNNER_TEMP/mac-screens"
      - name: Desktop (debug)
        if: ${{ !cancelled() }}
        run: screencapture -x "$RUNNER_TEMP/mac-screens/desktop.png" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: mac-screens
          path: ${{ runner.temp }}/mac-screens
          retention-days: 7
