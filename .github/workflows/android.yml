name: Android app

on:
  push:
    branches: [main, "claude/**"]
    paths: ["android/**", "design/tokens.json", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "design/tokens.json", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, lint and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Core model tests
        run: ./gradlew :core:test --stacktrace

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload screen tour
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-screens
          path: android/app/build/screens
          if-no-files-found: warn
          retention-days: 7

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: encave-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
