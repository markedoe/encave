name: Android app

on:
  push:
    branches: [main, "claude/**"]
    paths: ["android/**", "design/tokens.json", "relay/**", "licences/**", "LICENSE", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "design/tokens.json", "relay/**", "licences/**", "LICENSE", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, lint and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Strings up to date, French typography
        run: python3 tools/strings.py --check

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Core model tests
        # A local relay (relay/server.mjs) for the remote sync integration test.
        run: |
          mkdir -p "$RUNNER_TEMP/relay"
          (cd .. && PORT=8787 DATA_DIR="$RUNNER_TEMP/relay" node relay/server.mjs &)
          for i in $(seq 1 50); do curl -fs http://localhost:8787/v1/health && break; sleep 0.2; done
          ENCAVE_RELAY_URL=http://localhost:8787 ./gradlew :core:test --stacktrace

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload screen tour
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-screens
          path: android/app/build/screens
          if-no-files-found: warn
          retention-days: 7

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Licences list up to date
        # Settings › About › Licences matches the release runtime classpath.
        run: python3 tools/licences.py --check

      - name: Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encave-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release bundle and lint
    # Pushes to main and manual runs only (not claude/** branches or pull requests).
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Build number
        # Same formula as apple.yml: run number plus attempt, so it always increases.
        run: echo "BUILD_NUMBER=$(( 1000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT ))" >> "$GITHUB_ENV"

      - name: Upload keystore
        # Only when the secret is set (never on forks); the bundle is unsigned otherwise.
        env:
          ENCAVE_KEYSTORE_BASE64: ${{ secrets.ENCAVE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ENCAVE_KEYSTORE_BASE64" ]; then
            echo "::warning::No ENCAVE_KEYSTORE_BASE64 secret: the release bundle is unsigned."
            exit 0
          fi
          keystore="$RUNNER_TEMP/encave-upload.jks"
          printf '%s' "$ENCAVE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ENCAVE_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Release lint and bundle
        # Gradle signs only when the keystore path and the three secrets are all set.
        env:
          ENCAVE_KEYSTORE_PASSWORD: ${{ secrets.ENCAVE_KEYSTORE_PASSWORD }}
          ENCAVE_KEY_ALIAS: ${{ secrets.ENCAVE_KEY_ALIAS }}
          ENCAVE_KEY_PASSWORD: ${{ secrets.ENCAVE_KEY_PASSWORD }}
        run: ./gradlew :app:lintRelease :app:bundleRelease --stacktrace

      - name: Remove the keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/encave-upload.jks"

      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encave-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload R8 mapping
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encave-release-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90
