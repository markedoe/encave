name: Android app

on:
  push:
    branches: [main, "claude/**"]
    paths: ["android/**", "design/tokens.json", "design/generate_app_icon.py", "docs/store/play.json", "relay/**", "fixtures/**", "licences/**", "LICENSE", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "design/tokens.json", "design/generate_app_icon.py", "docs/store/play.json", "relay/**", "fixtures/**", "licences/**", "LICENSE", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Runs on main are never cancelled (one group per run): a Google Play upload is not cut off.
concurrency:
  group: android-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Tests, lint and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Strings up to date, French typography
        run: python3 tools/strings.py --check

      - name: Release script tests
        # play_publish.py against fake Google Play answers (no network), emulator_smoke.py
        # against fake screens (system dialogs of other apps).
        run: python3 -m unittest discover -s tools -v

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The MIT-licensed cache (actions/cache), not the proprietary default of v6.
          cache-provider: basic

      - name: Core model tests
        # A local relay (relay/server.mjs) for the remote sync integration test.
        run: |
          mkdir -p "$RUNNER_TEMP/relay"
          (cd .. && PORT=8787 DATA_DIR="$RUNNER_TEMP/relay" node relay/server.mjs > "$RUNNER_TEMP/relay.log" 2>&1 &)
          up=""
          for i in $(seq 1 50); do curl -fs http://localhost:8787/v1/health && { up=1; break; }; sleep 0.2; done
          [ -n "$up" ] || { echo "::error::The local relay did not start in 10 s."; cat "$RUNNER_TEMP/relay.log"; exit 1; }
          # --rerun: a relay-only change leaves the Gradle inputs alike, and the cached result
          # would skip the sync test against this relay.
          ENCAVE_RELAY_URL=http://localhost:8787 ./gradlew :core:test --rerun --stacktrace

      - name: App unit tests
        # --rerun: the quick tour's screenshots (app/build/screens, used below) are not cached outputs.
        run: ./gradlew :app:testDebugUnitTest --rerun --stacktrace

      - name: Google Play listing images
        # From the quick tour of the unit tests: checks play_listing_images.py and docs/store/play.json
        # (sizes and ratios Play takes) before main, where play-closed makes them from the full tour.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends python3-pil fonts-inter
          /usr/bin/python3 tools/play_listing_images.py app/build/screens "$RUNNER_TEMP/listing"

      - name: Upload listing images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-listing-preview
          path: ${{ runner.temp }}/listing
          if-no-files-found: error
          retention-days: 7

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Licences list up to date
        # Settings › About › Licences matches the release runtime classpath.
        run: python3 tools/licences.py --check

      - name: Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encave-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  tour:
    name: Screen tour
    # The full tour, reviewed on every main build: phone (411x891 dp) and tablet (1280x800 dp),
    # English and French, light and dark, and the phone at font scale 2.0 (Robolectric, no
    # emulator). Branch pushes and pull requests run a quicker set within the unit tests.
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The MIT-licensed cache (actions/cache), not the proprietary default of v6.
          cache-provider: basic

      - name: Screen tour
        run: ./gradlew :app:testDebugUnitTest --tests 'app.encave.ui.ScreenTourTest' -Pencave.tour=full --stacktrace

      - name: List screenshots
        if: ${{ !cancelled() }}
        run: |
          for dir in app/build/screens/*/; do echo "$dir: $(find "$dir" -name '*.png' | wc -l)"; done
          echo "Total: $(find app/build/screens -name '*.png' | wc -l)"

      - name: Upload screen tour
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-screens
          path: android/app/build/screens
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release bundle and lint
    # Pushes to main and manual runs only (not claude/** branches or pull requests).
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    # The release secrets' environment (docs/RELEASING.md, Security), on main only.
    environment: ${{ github.ref == 'refs/heads/main' && 'release' || '' }}
    timeout-minutes: 45
    outputs:
      version-code: ${{ steps.bundle.outputs.version-code }}
      signed: ${{ steps.bundle.outputs.signed }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The MIT-licensed cache (actions/cache), not the proprietary default of v6.
          cache-provider: basic

      - name: Build number
        # Same formula as apple.yml: run number plus attempt, so it always increases.
        run: echo "BUILD_NUMBER=$(( 1000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT ))" >> "$GITHUB_ENV"

      - name: Upload keystore
        # Only on main and when the secret is set (never on forks or other branches, whose
        # code must not get the upload key); the bundle is unsigned otherwise.
        if: github.ref == 'refs/heads/main'
        env:
          ENCAVE_KEYSTORE_BASE64: ${{ secrets.ENCAVE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ENCAVE_KEYSTORE_BASE64" ]; then
            echo "::warning::No ENCAVE_KEYSTORE_BASE64 secret: the release bundle is unsigned."
            exit 0
          fi
          keystore="$RUNNER_TEMP/encave-upload.jks"
          printf '%s' "$ENCAVE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ENCAVE_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Release lint and bundle
        # Gradle signs only when the keystore path and the three secrets are all set (main only).
        env:
          ENCAVE_KEYSTORE_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.ENCAVE_KEYSTORE_PASSWORD || '' }}
          ENCAVE_KEY_ALIAS: ${{ github.ref == 'refs/heads/main' && secrets.ENCAVE_KEY_ALIAS || '' }}
          ENCAVE_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.ENCAVE_KEY_PASSWORD || '' }}
        run: ./gradlew :app:lintRelease :app:bundleRelease --stacktrace

      - name: Remove the keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/encave-upload.jks"

      - name: Signed or not
        # Google Play takes only a bundle signed with the upload key.
        id: bundle
        run: |
          echo "version-code=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          if jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep -q "jar verified"; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encave-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          # Google Play keeps the uploaded bundle.
          retention-days: 7

      - name: Upload R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encave-release-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          # Google Play keeps the mapping (readable stack traces in Android vitals).
          retention-days: 7

  smoke:
    name: Emulator smoke test
    # The release bundle itself (R8-shrunk), turned into an APK and run on an Android 15
    # emulator: loads the sample cellar and opens the four tabs, in English and French.
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: encave-release-aab
          path: ${{ runner.temp }}/bundle

      - name: APK from the bundle
        # bundletool makes one universal APK from the bundle, signed with a throwaway key.
        env:
          BUNDLETOOL_VERSION: 1.18.3
          BUNDLETOOL_SHA256: a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo bundletool.jar "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          echo "$BUNDLETOOL_SHA256  bundletool.jar" | sha256sum --check
          keytool -genkeypair -keystore smoke.jks -storepass smokesmoke -keypass smokesmoke -alias smoke \
            -keyalg RSA -keysize 2048 -validity 1 -dname CN=smoke
          java -jar bundletool.jar build-apks --bundle bundle/app-release.aab --output encave.apks --mode universal \
            --ks smoke.jks --ks-pass pass:smokesmoke --ks-key-alias smoke --key-pass pass:smokesmoke
          unzip -o encave.apks universal.apk
          echo "SMOKE_APK=$RUNNER_TEMP/universal.apk" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: python3 -u android/tools/emulator_smoke.py "$SMOKE_APK" smoke-screens

      - name: Upload smoke test screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-smoke
          path: smoke-screens
          if-no-files-found: ignore
          retention-days: 7

  play-internal:
    name: Google Play internal testing
    # Every signed bundle built on main goes to the internal testers at once. Skipped with a
    # notice until the Play variables are set (forks, before the one-time setup). Only after
    # the build job (core and app tests, sync vectors, lint, licences) passed.
    needs: [build, release]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      released: ${{ steps.publish.outputs.released }}
    steps:
      - name: Play setup
        id: setup
        env:
          PLAY_WIF_PROVIDER: ${{ vars.PLAY_WIF_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          SIGNED: ${{ needs.release.outputs.signed }}
        run: |
          if [ -z "$PLAY_WIF_PROVIDER" ] || [ -z "$PLAY_SERVICE_ACCOUNT" ]; then
            echo "::notice::No PLAY_WIF_PROVIDER or PLAY_SERVICE_ACCOUNT variable: nothing sent to Google Play (docs/RELEASING.md)."
          elif [ "$SIGNED" != "true" ]; then
            echo "::notice::The release bundle is not signed (ENCAVE_KEYSTORE_* secrets): nothing sent to Google Play."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.setup.outputs.ready == 'true' }}
        with:
          fetch-depth: 30

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ steps.setup.outputs.ready == 'true' }}
        with:
          name: encave-release-aab
          path: ${{ runner.temp }}/bundle

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ steps.setup.outputs.ready == 'true' }}
        with:
          name: encave-release-mapping
          path: ${{ runner.temp }}/mapping

      - name: Google Cloud credentials
        # Workload Identity Federation: a short-lived token for the service account, no stored key.
        id: auth
        if: ${{ steps.setup.outputs.ready == 'true' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Upload to internal testing
        id: publish
        if: ${{ steps.setup.outputs.ready == 'true' }}
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PACKAGE_NAME: markeddoe.com.encave
          VERSION_CODE: ${{ needs.release.outputs.version-code }}
          BUNDLE_PATH: ${{ runner.temp }}/bundle/app-release.aab
          MAPPING_PATH: ${{ runner.temp }}/mapping/mapping.txt
          TRACK: internal
        # Release notes: the build number and the latest commit subjects, in English and French.
        run: |
          python3 android/tools/play_publish.py upload
          echo "released=true" >> "$GITHUB_OUTPUT"

  play-closed:
    name: Google Play closed testing
    # The same version code, already uploaded, to the closed testing track (the beta testers),
    # once the screen tour and the emulator smoke test of this run passed. Nothing is rebuilt.
    # The store listing (docs/store/play.json, images made from this run's screen tour) goes in
    # the same edit, so Google reviews both together; unchanged texts and images are skipped.
    # On by default, to the built-in closed track "alpha"; the PLAY_CLOSED_TRACK variable names
    # another closed track, or turns closed testing off with "none".
    needs: [build, release, tour, smoke, play-internal]
    if: ${{ github.ref == 'refs/heads/main' && needs.play-internal.outputs.released == 'true' && vars.PLAY_CLOSED_TRACK != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 30

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-screens
          path: ${{ runner.temp }}/screens

      - name: Listing images
        # Icon, feature graphic, framed phone screenshots and tablet screenshots, from the
        # sample cellar of this run's tour (android/tools/play_listing_images.py).
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends python3-pil fonts-inter
          /usr/bin/python3 android/tools/play_listing_images.py "$RUNNER_TEMP/screens" "$RUNNER_TEMP/listing"

      - name: Upload listing images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-listing
          path: ${{ runner.temp }}/listing
          if-no-files-found: error
          retention-days: 14

      - name: Google Cloud credentials
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Store listing and closed testing
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PACKAGE_NAME: markeddoe.com.encave
          VERSION_CODE: ${{ needs.release.outputs.version-code }}
          TRACK: ${{ vars.PLAY_CLOSED_TRACK || 'alpha' }}
          LISTING_JSON: docs/store/play.json
          LISTING_IMAGES: ${{ runner.temp }}/listing
        run: python3 android/tools/play_publish.py promote
