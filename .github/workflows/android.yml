name: Android app

on:
  push:
    branches: [main, "claude/**"]
    paths: ["android/**", "design/tokens.json", "relay/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "design/tokens.json", "relay/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests, lint and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Core model tests
        # A local relay (relay/server.mjs) for the remote sync integration test.
        run: |
          mkdir -p "$RUNNER_TEMP/relay"
          (cd .. && PORT=8787 DATA_DIR="$RUNNER_TEMP/relay" node relay/server.mjs &)
          for i in $(seq 1 50); do curl -fs http://localhost:8787/v1/health && break; sleep 0.2; done
          ENCAVE_RELAY_URL=http://localhost:8787 ./gradlew :core:test --stacktrace

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload screen tour
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-screens
          path: android/app/build/screens
          if-no-files-found: warn
          retention-days: 7

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: encave-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
