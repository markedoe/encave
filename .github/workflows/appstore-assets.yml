name: App Store header image

# Run by hand. "inspect" only reads App Store Connect; "upload" puts
# docs/store/header-*.png in the asset library and places each one as the
# product page header and the search results asset of the version being
# prepared (French and English). Nothing is submitted for review.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect or upload"
        type: choice
        options: [inspect, upload]
        default: inspect
      locales:
        description: "Only these languages, e.g. en-US (empty: all)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  assets:
    name: Header and search results
    # The App Store Connect key is given to code from main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Header and search results image
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: app.encave
          MODE: ${{ inputs.mode }}
          LOCALES: ${{ inputs.locales }}
          IMAGES: fr-FR=docs/store/header-fr.png,en-US=docs/store/header-en.png
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          python3 apple/tools/asc_key.py "$ASC_KEY_PATH"
          python3 scripts/asc_creative_assets.py

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
