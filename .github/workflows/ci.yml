name: CI

on:
  pull_request:
  push:
    # Agent branches too: they are public as soon as they are pushed.
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch cancels that branch's older run; on main every push is checked.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GITLEAKS_VERSION: "8.28.0"
  # From gitleaks_8.28.0_checksums.txt of the release.
  GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"

jobs:
  # Blocks any secret, forbidden file or infra detail from reaching the repo.
  secrets:
    name: Secrets & public-safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C /usr/local/bin gitleaks

      - name: Compute commit range
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "range=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "range=${{ github.event.before }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" != "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            # A new branch: every commit it has that the default branch does not.
            echo "range=origin/${{ github.event.repository.default_branch }}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${{ github.sha }}^!" >> "$GITHUB_OUTPUT"
          fi

      - name: Gitleaks (new commits)
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --log-opts="${{ steps.range.outputs.range }}"

      - name: Gitleaks (current tree)
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner

      - name: Commit messages (short, no prompt text)
        run: scripts/check-commit-message.sh --range "${{ steps.range.outputs.range }}"

      - name: Pull request title and body (no prompt text)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pr.txt"
          scripts/check-commit-message.sh --text-only "$RUNNER_TEMP/pr.txt"

      - name: Release secrets only for code from main
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          scripts/check-workflow-secrets.py

      - name: Design tokens only (no system colors in the Apple features)
        run: scripts/check-system-colors.sh

      - name: Public-safety check tests
        # Throwaway repositories the check must refuse (keys, paths, merge resolutions).
        run: scripts/test-check-public-safety.sh

      - name: Public-safety check
        env:
          CHECK_COMMIT_RANGE: ${{ steps.range.outputs.range }}
        run: scripts/check-public-safety.sh
