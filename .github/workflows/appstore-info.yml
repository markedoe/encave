name: App Store listing

# Run by hand. "inspect" only reads the listing; "apply" sets what
# docs/store/appstore.json gives (privacy policy URL, age rating, names and
# texts per language). Nothing is submitted for review.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect or apply"
        type: choice
        options: [inspect, apply]
        default: inspect

permissions:
  contents: read

jobs:
  listing:
    name: Listing
    # The App Store Connect key is given to code from main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: App Store listing
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: app.encave
          MODE: ${{ inputs.mode }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          python3 apple/tools/asc_key.py "$ASC_KEY_PATH"
          python3 scripts/asc_store_info.py

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
