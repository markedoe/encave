name: Google Play listing

# Publishes the Google Play store listing and the Data safety form, by hand (Actions ›
# Google Play listing › Run workflow, branch main). Self-contained: the screen tour runs
# here for the screenshots. android.yml also updates the listing with each closed release.
#   texts         docs/store/play.json (fr-FR default, en-US)
#   images        android/tools/play_listing_images.py, from the sample cellar of the tour
#   Data safety   docs/store/play-data-safety.csv (no data collected or shared, docs/STORE.md)
# Service account permissions (Play Console › Users and permissions, app Encave):
# "Manage store presence" for the listing, "Manage policy declarations" for Data safety.

on:
  workflow_dispatch:
    inputs:
      listing:
        description: Store listing (texts and images)
        type: boolean
        default: true
      data-safety:
        description: Data safety form
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: play-listing
  cancel-in-progress: false

jobs:
  images:
    name: Screen tour and listing images
    if: ${{ github.ref == 'refs/heads/main' && inputs.listing }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Screen tour
        # Phone and tablet, English and French, with the sample cellar (Robolectric).
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --tests 'app.encave.ui.ScreenTourTest' --stacktrace

      - name: Listing images
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends python3-pil fonts-inter
          /usr/bin/python3 android/tools/play_listing_images.py android/app/build/screens "$RUNNER_TEMP/listing"

      - name: Upload listing images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: play-listing
          path: ${{ runner.temp }}/listing
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to Google Play
    needs: images
    # Runs for Data safety alone too (images skipped), never when the images failed.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.images.result != 'failure' && (inputs.listing || inputs.data-safety) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Play setup
        env:
          PLAY_WIF_PROVIDER: ${{ vars.PLAY_WIF_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$PLAY_WIF_PROVIDER" ] || [ -z "$PLAY_SERVICE_ACCOUNT" ]; then
            echo "::error::No PLAY_WIF_PROVIDER or PLAY_SERVICE_ACCOUNT variable (docs/RELEASING.md)."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ inputs.listing }}
        with:
          name: play-listing
          path: ${{ runner.temp }}/listing

      - name: Google Cloud credentials
        # Workload Identity Federation: a short-lived token for the service account, no stored key.
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Store listing
        if: ${{ inputs.listing }}
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PACKAGE_NAME: markeddoe.com.encave
          LISTING_JSON: docs/store/play.json
          LISTING_IMAGES: ${{ runner.temp }}/listing
        run: python3 android/tools/play_publish.py listing

      - name: Data safety
        if: ${{ inputs.data-safety && !cancelled() }}
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PACKAGE_NAME: markeddoe.com.encave
          DATA_SAFETY_CSV: docs/store/play-data-safety.csv
        run: python3 android/tools/play_publish.py data-safety
