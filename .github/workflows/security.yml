name: Security

on:
  schedule:
    - cron: "17 5 * * 1" # weekly, Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Full-history secret scan.
  history:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          # From gitleaks_8.28.0_checksums.txt of the release.
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $archive" | sha256sum -c -
          tar -xzf "$archive" -C /usr/local/bin gitleaks
          gitleaks git . --config .gitleaks.toml --redact --no-banner
      - name: Public-safety check (whole history)
        env:
          CHECK_COMMIT_RANGE: HEAD
        run: scripts/check-public-safety.sh

  codeql:
    name: CodeQL (workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: actions
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
