name: Apple apps

on:
  push:
    branches: [main, "claude/**"]
    paths: ["apple/**", "design/**", "fixtures/**", "licences/**", "LICENSE", "scripts/check-privacy-manifest.sh", ".github/workflows/apple.yml"]
  pull_request:
    paths: ["apple/**", "design/**", "fixtures/**", "licences/**", "LICENSE", "scripts/check-privacy-manifest.sh", ".github/workflows/apple.yml"]
  workflow_dispatch:
    inputs:
      external_testers:
        description: "Also give this build to the external TestFlight testers (pushes to main always do, after the screen tour)"
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a branch cancels that branch's older run. Runs on main are never
# cancelled (each one brings a build to the TestFlight testers once its tour passes),
# and get a group of their own so that they never wait for each other either.
concurrency:
  group: apple-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  cavekit:
    name: CaveKit tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # swift:6.2 as of October 2026, pinned by digest (the multi-architecture index).
    container: swift:6.2@sha256:d6f8f6112e9a63da0a4a151d6b93acd16699d35c0b82531ac1a245f5af210197
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: swift test --package-path apple/Packages/CaveKit

  l10n:
    name: French translations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 apple/tools/l10n.py --check
      # The licences shown in Settings › About › Licences match Package.resolved.
      - run: python3 apple/tools/licences.py --check

  tour-check:
    name: Tour already passed on this commit?
    # On main, a commit whose tour already passed (a branch fast-forwarded to main after
    # its own tour) is not toured again: its build goes to the testers once uploaded.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=false
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/apple.yml/runs?head_sha=$GITHUB_SHA&status=completed&per_page=20" \
              --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .id")
            for run in $runs; do
              # Every tour job of that run's latest attempt passed (the same commit has the
              # same workflow, so the same tour jobs).
              ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?filter=latest&per_page=100" \
                --jq '[.jobs[] | select(.name | startswith("Screen tour"))] | length > 0 and all(.conclusion == "success")')
              if [ "$ok" = true ]; then
                echo "The screen tour passed on this commit in run $run: not run again."
                passed=true
                break
              fi
            done
          fi
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

  screens:
    name: Screen tour (${{ matrix.device }}, ${{ matrix.language }})
    needs: [cavekit, l10n, tour-check]
    # The full tour runs on main before each TestFlight build, on pull requests and on
    # manual runs. Pushes to other branches only build and run the Mac launch test, so
    # fixes reach main faster.
    if: (github.event_name != 'push' || github.ref == 'refs/heads/main') && needs.tour-check.outputs.passed != 'true'
    runs-on: macos-latest
    # One simulator per job, four jobs side by side (with the apps job, the five macOS
    # runners a free account runs at once). Two simulators on one runner slow each other,
    # and three fail to launch the app; one a runner runs at full speed.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iPhone
            language: English
            tests: testTourInEnglish testLargeText testLargestText
            mac: true
          - device: iPhone
            language: French
            tests: testTourInFrench testStudioPicturesInLight testStudioPicturesInDark
          - device: iPad
            language: English
            tests: testTourInEnglish
            model: true
          - device: iPad
            language: French
            tests: testTourInFrench testStudioPicturesInLight testStudioPicturesInDark
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select newest Xcode
        working-directory: .
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"

      - name: Generate project
        run: |
          brew install xcodegen xcbeautify
          xcodegen generate

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Encave.xcodeproj -scheme Encave \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO | xcbeautify --renderer github-actions

      - name: Model tests (macOS)
        if: matrix.model
        run: swift test --package-path Packages/CaveKit

      - name: Start the simulator
        if: ${{ !cancelled() }}
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          set -e
          # The newest iPhone (not mini) or iPad. Booted first: a cold simulator can time
          # out launching the app under test. Nothing else runs meanwhile: a booting
          # simulator slows all else.
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          udid=$(python3 - "$RUNNER_TEMP/devices.json" "$DEVICE" <<'PY'
          import json, sys
          found = []
          for runtime, devices in json.load(open(sys.argv[1]))["devices"].items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d["name"].startswith(sys.argv[2]) and "mini" not in d["name"]:
                      found.append((runtime, d["name"], d["udid"]))
          found.sort()
          runtime, name, udid = found[-1]
          print(f"{name} ({runtime})", file=sys.stderr)
          print(udid)
          PY
          )
          echo "SIM=$udid" >> "$GITHUB_ENV"
          echo "Booting at $(date -u +%T)"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" > /dev/null
          echo "Booted at $(date -u +%T)"

      - name: Tour
        if: ${{ !cancelled() }}
        env:
          DEVICE: ${{ matrix.device }}
          TESTS: ${{ matrix.tests }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          set -o pipefail
          xctestrun=$(find "$RUNNER_TEMP/dd/Build/Products" -name "*.xctestrun" | head -n 1)
          only=()
          for test in $TESTS; do only+=("-only-testing:EncaveUITests/ScreenTourTests/$test"); done
          name="$DEVICE-$LANGUAGE"
          echo "Started at $(date -u +%T)"
          # A one-off simulator timeout (a screenshot request) is retried once.
          xcodebuild test-without-building -xctestrun "$xctestrun" -destination "id=$SIM" \
            -retry-tests-on-failure -test-iterations 2 -resultBundlePath "$RUNNER_TEMP/$name.xcresult" "${only[@]}" 2>&1 \
            | tee "$RUNNER_TEMP/$name.raw" | xcbeautify --renderer github-actions
          echo "Finished at $(date -u +%T)"

      - name: Slowest steps of the tour
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          for result in "$RUNNER_TEMP"/iP*.xcresult; do
            [ -e "$result" ] || continue
            for test in testTourInEnglish testTourInFrench; do
              xcrun xcresulttool get test-results activities --path "$result" \
                --test-id "ScreenTourTests/$test()" > "$RUNNER_TEMP/activities.json" 2>/dev/null || continue
              echo "== $(basename "$result" .xcresult) $test"
              python3 - "$RUNNER_TEMP/activities.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          rows = []
          def walk(items, end, depth):
              for i, item in enumerate(items):
                  start = item.get("startTime")
                  nxt = items[i + 1].get("startTime") if i + 1 < len(items) else end
                  if start is not None and nxt is not None:
                      rows.append((nxt - start, depth, item.get("title", "")[:150]))
                  walk(item.get("childActivities", []), nxt, depth + 1)
          for run in data.get("testRuns", []):
              acts = run.get("activities", [])
              walk(acts, None, 0)
          top = [r for r in rows if r[1] == 0]
          print("total top-level:", round(sum(r[0] for r in top)), "s in", len(top), "steps")
          for d, depth, title in sorted(rows, reverse=True)[:40]:
              print(f"{d:7.1f}s  {'  ' * depth}{title}")
          PY
            done
          done

      - name: Mac
        if: ${{ !cancelled() && matrix.mac }}
        # GitHub's Mac runners have not shown windows to UI tests ("The main window opens"
        # failed); the Mac screenshots of the build job show each section.
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test -project Encave.xcodeproj -scheme EncaveMac -destination 'platform=macOS' \
            -resultBundlePath "$RUNNER_TEMP/Mac.xcresult" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            | xcbeautify --renderer github-actions \
            || echo "::warning::The Mac UI tour could not run on this runner; see the Mac screenshots."

      - name: Export screenshots
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/screens"
          for result in "$RUNNER_TEMP"/*.xcresult; do
            [ -e "$result" ] || continue
            name=$(basename "$result" .xcresult)
            out="$RUNNER_TEMP/export-$name"
            # iPhone-en and iPhone-fr both go to screens/iPhone (file names start with the language).
            xcrun xcresulttool export attachments --path "$result" --output-path "$out" || continue
            # Name each file after its attachment: iPhone/en-03-wine.png
            python3 - "$out" "$RUNNER_TEMP/screens/${name%%-*}" <<'PY'
          import json, os, shutil, sys
          src, dst = sys.argv[1], sys.argv[2]
          os.makedirs(dst, exist_ok=True)
          import re
          for test in json.load(open(os.path.join(src, "manifest.json"))):
              for item in test.get("attachments", []):
                  ext = os.path.splitext(item["exportedFileName"])[1].lower()
                  if ext == ".ips":
                      # Crash reports of the app under test: kept to find the cause.
                      os.makedirs(os.path.join(dst, "crashes"), exist_ok=True)
                      shutil.copy(os.path.join(src, item["exportedFileName"]),
                                  os.path.join(dst, "crashes", item["exportedFileName"]))
                      continue
                  if ext not in (".png", ".jpg", ".jpeg", ".heic"):
                      continue  # debug descriptions and logs
                  human = item.get("suggestedHumanReadableName") or item["exportedFileName"]
                  base = human.split("_")[0] if human.count("_") > 1 else os.path.splitext(human)[0]
                  base = re.sub(r"[^A-Za-z0-9.-]+", "-", base).strip("-") or "screen"
                  shutil.copy(os.path.join(src, item["exportedFileName"]), os.path.join(dst, base + ext))
          PY
          done
          find "$RUNNER_TEMP/screens" -type f | sort

      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screens-${{ matrix.device }}-${{ matrix.language }}
          path: ${{ runner.temp }}/screens
          retention-days: 7

  screens-merge:
    name: Screenshots in one artifact
    needs: screens
    if: ${{ !cancelled() && needs.screens.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The four parts as one "screens" artifact, a folder per device (iPhone, iPad, Mac).
      - uses: actions/upload-artifact/merge@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screens
          pattern: screens-*
          retention-days: 7
          delete-merged: true

  apps:
    name: Build, Mac launch test${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') && ', TestFlight upload' || '' }}
    needs: [cavekit, l10n]
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      # The build number, set only when this run uploads (the testers job needs it),
      # and which platforms were uploaded (each is set once its upload went through).
      build: ${{ steps.key.outputs.build }}
      ios: ${{ steps.ios.outputs.uploaded }}
      mac: ${{ steps.mac.outputs.uploaded }}
    defaults:
      run:
        working-directory: apple
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # Uploads on a push to main or a manual run on main, only when the secrets are
      # available (never on forks). Other branches, manual runs on them included, only
      # build: their builds never reach the testers.
      UPLOAD: ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') && secrets.ASC_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select newest Xcode
        working-directory: .
        run: |
          # Newest release Xcode (betas cannot upload to App Store Connect).
          xcode=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen xcbeautify
          xcodegen generate

      - name: Build the Mac app (Release, signed to run locally)
        if: env.UPLOAD != 'true'
        run: |
          set -o pipefail
          xcodebuild build -project Encave.xcodeproj -scheme EncaveMac -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            COMPILER_INDEX_STORE_ENABLE=NO | xcbeautify --renderer github-actions
          app="$RUNNER_TEMP/dd/Build/Products/Release/Encave.app"
          ../scripts/check-privacy-manifest.sh "$app"
          echo "MAC_APP=$app" >> "$GITHUB_ENV"
          # The iPhone and iPad app builds while the Mac app is launched (the launch test
          # mostly waits); its result is checked in the last step.
          touch "$RUNNER_TEMP/ios-build.started"
          nohup bash -c 'xcodebuild build -project Encave.xcodeproj -scheme Encave -derivedDataPath "$RUNNER_TEMP/dd" \
            -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            > "$RUNNER_TEMP/ios-build.log" 2>&1; echo $? > "$RUNNER_TEMP/ios-build.status"' > /dev/null 2>&1 &

      - name: App Store Connect key
        id: key
        if: env.UPLOAD == 'true'
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          python3 tools/asc_key.py "$key"
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
          cp ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          # Build numbers must always increase: run number plus attempt.
          number=$(( 1000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT ))
          echo "BUILD_NUMBER=$number" >> "$GITHUB_ENV"
          echo "build=$number" >> "$GITHUB_OUTPUT"

      - name: Archive and upload (iPhone, iPad)
        id: ios
        if: env.UPLOAD == 'true'
        run: |
          set -o pipefail
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # TestFlight builds are betas (ENCAVE_CHANNEL=store turns the beta notices and the
          # sample cellar off for the App Store, docs/development.md).
          # Archive unsigned: signing with a development certificate would create a new
          # certificate on every fresh runner. The export below signs with cloud signing.
          xcodebuild archive -project Encave.xcodeproj -scheme Encave \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/ios.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            ENCAVE_CHANNEL=beta CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions
          ../scripts/check-privacy-manifest.sh "$RUNNER_TEMP/ios.xcarchive/Products/Applications/Encave.app"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ios.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export-ios" \
            "${auth[@]}" | xcbeautify --renderer github-actions
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Archive and upload (Mac)
        id: mac
        if: env.UPLOAD == 'true'
        run: |
          set -o pipefail
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # Signed to run locally so the sandbox entitlements are in the archive;
          # the export re-signs it with cloud signing (no new certificate).
          xcodebuild archive -project Encave.xcodeproj -scheme EncaveMac \
            -destination 'generic/platform=macOS' -archivePath "$RUNNER_TEMP/mac.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" ENCAVE_CHANNEL=beta \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER= | xcbeautify --renderer github-actions
          ../scripts/check-privacy-manifest.sh "$RUNNER_TEMP/mac.xcarchive/Products/Applications/Encave.app"
          echo "MAC_APP=$RUNNER_TEMP/mac.xcarchive/Products/Applications/Encave.app" >> "$GITHUB_ENV"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/mac.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export-mac" \
            "${auth[@]}" | xcbeautify --renderer github-actions
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      - name: Mac launch test (twice, then each section; reports crashes)
        # Also when the upload failed: the archived app is there.
        if: ${{ !cancelled() && env.MAC_APP != '' }}
        run: |
          app="$MAC_APP"
          reports="$HOME/Library/Logs/DiagnosticReports"
          status=0
          # Empty first and second launch, then every tab with the sample cellar.
          for attempt in first second cellar racks tonight journal; do
            case "$attempt" in
              first|second) args=() ;;
              *) args=(--tab "$attempt" --sample-data) ;;
            esac
            "$app/Contents/MacOS/Encave" "${args[@]}" > "$RUNNER_TEMP/launch-$attempt.log" 2>&1 &
            pid=$!
            sleep 20
            if kill -0 "$pid" 2>/dev/null; then
              echo "$attempt launch: still running after 20 s"
              kill "$pid"; wait "$pid" 2>/dev/null || true
            else
              wait "$pid"; code=$?
              echo "::error::$attempt launch: exited with code $code"
              status=1
            fi
            echo "--- output ($attempt launch) ---"
            tail -n 80 "$RUNNER_TEMP/launch-$attempt.log"
          done
          sleep 5
          for report in "$reports"/Encave*; do
            [ -e "$report" ] || continue
            echo "--- $report ---"
            # The crash report is JSON after a one-line header: print the useful part.
            python3 - "$report" <<'PY'
          import json, sys
          text = open(sys.argv[1]).read()
          header, _, body = text.partition("\n")
          try:
              data = json.loads(body)
          except Exception:
              print(text[:6000]); sys.exit()
          print(json.dumps(data.get("exception"), indent=1))
          print(json.dumps(data.get("termination"), indent=1))
          print(json.dumps(data.get("asi"), indent=1))
          images = data.get("usedImages", [])
          for thread in data.get("threads", []):
              if not thread.get("triggered"):
                  continue
              for frame in thread.get("frames", [])[:40]:
                  image = images[frame.get("imageIndex", 0)] if images else {}
                  print(image.get("name", "?"), frame.get("symbol", ""), frame.get("sourceFile", ""), frame.get("sourceLine", ""))
          PY
            status=1
          done
          exit $status

      - name: Mac screenshots
        # Main, pull requests and manual runs, like the tour.
        if: ${{ !cancelled() && env.MAC_APP != '' && (github.event_name != 'push' || github.ref == 'refs/heads/main') }}
        # Each section with the sample cellar, English and French, light and dark, at the
        # App Store size (2880x1800), on a HiDPI virtual display: see the script. Not a
        # gate for the external testers: a failure shows as a warning.
        continue-on-error: true
        timeout-minutes: 20
        run: |
          # The app of the launch test above: archived on main, a Release build elsewhere.
          tools/mac-screenshots.sh "$MAC_APP" "$RUNNER_TEMP/mac-screens"

      - name: Upload Mac screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac-screens
          path: ${{ runner.temp }}/mac-screens
          retention-days: 7
          if-no-files-found: ignore

      - name: Build the iPhone and iPad app (simulator, no signing)
        if: ${{ !cancelled() && env.UPLOAD != 'true' }}
        timeout-minutes: 20
        run: |
          [ -e "$RUNNER_TEMP/ios-build.started" ] || { echo "::error::Not built: the Mac build failed first."; exit 1; }
          while [ ! -e "$RUNNER_TEMP/ios-build.status" ]; do sleep 5; done
          xcbeautify --renderer github-actions < "$RUNNER_TEMP/ios-build.log"
          [ "$(cat "$RUNNER_TEMP/ios-build.status")" = 0 ] || exit 1
          ../scripts/check-privacy-manifest.sh "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Encave.app"

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  testers:
    name: TestFlight external testers
    needs: [apps, screens, tour-check]
    # Every build of main goes to the external testers once the full screen tour has
    # passed, in this run or in an earlier run of the same commit (tour-check); a manual
    # run from main does too when "external testers" is ticked. Also
    # when one upload failed (the Mac one runs after the iPhone one): the uploaded build
    # still reaches the testers, and the apps job and the run stay failed, with a warning
    # below.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (needs.screens.result == 'success' || needs.tour-check.outputs.passed == 'true') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.external_testers)) && needs.apps.outputs.build != '' && (needs.apps.outputs.ios == 'true' || needs.apps.outputs.mac == 'true') }}
    runs-on: ubuntu-latest
    # App Store Connect takes 5 to 30 minutes to process a build.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 30

      - name: Give the build to the external testers
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_NUMBER: ${{ needs.apps.outputs.build }}
          BUNDLE_ID: app.encave
          IOS_UPLOADED: ${{ needs.apps.outputs.ios }}
          MAC_UPLOADED: ${{ needs.apps.outputs.mac }}
        run: |
          platforms=()
          if [ "$IOS_UPLOADED" = true ]; then platforms+=(IOS); else echo "::warning::The iPhone and iPad build $BUILD_NUMBER was not uploaded: only the Mac build goes to the testers."; fi
          if [ "$MAC_UPLOADED" = true ]; then platforms+=(MAC_OS); else echo "::warning::The Mac build $BUILD_NUMBER was not uploaded: only the iPhone and iPad build goes to the testers."; fi
          PLATFORMS=$(IFS=,; echo "${platforms[*]}")
          export PLATFORMS
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          python3 apple/tools/asc_key.py "$ASC_KEY_PATH"
          # "What to Test": the latest changes, as in the commit history.
          WHATS_NEW="Beta build $BUILD_NUMBER. Latest changes:
          $(git log --no-merges -n 10 --format='- %s')"
          export WHATS_NEW
          python3 apple/tools/testflight_testers.py

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
