name: TestFlight status

# Read-only: shows the latest TestFlight builds, which external groups have them
# and where Beta App Review stands. Changes nothing in App Store Connect.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    name: TestFlight status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Show builds, groups and Beta App Review
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: app.encave
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          python3 apple/tools/asc_key.py "$ASC_KEY_PATH"
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, sys
          sys.path.insert(0, "apple/tools")
          from testflight_testers import call, APIError

          def safe(method, path, **kw):
              try:
                  return call(method, path, **kw)
              except APIError as error:
                  print(f"- {path}: HTTP {error.status}")
                  return {"data": [], "included": []}

          app = call("GET", "/apps", query={"filter[bundleId]": os.environ["BUNDLE_ID"], "limit": 1})["data"][0]
          app_id = app["id"]

          print("## TestFlight groups\n")
          groups = safe("GET", "/betaGroups", query={"filter[app]": app_id, "limit": 50})["data"]
          in_group = {}
          for group in groups:
              a = group["attributes"]
              if a.get("isInternalGroup"):
                  testers = safe("GET", f"/betaGroups/{group['id']}/betaTesters", query={"limit": 200})["data"]
                  print(f"- internal **{a['name']}**: {len(testers)} testers")
                  continue
              builds = safe("GET", f"/betaGroups/{group['id']}/builds", query={"limit": 50})["data"]
              testers = safe("GET", f"/betaGroups/{group['id']}/betaTesters", query={"limit": 200})["data"]
              print(f"- **{a['name']}**: {len(testers)} testers, {len(builds)} builds")
              for build in builds:
                  in_group.setdefault(build["id"], []).append(a["name"])
          if not any(not g["attributes"].get("isInternalGroup") for g in groups):
              print("- none")

          print("\n## Test Information\n")
          detail = safe("GET", f"/apps/{app_id}/betaAppReviewDetail").get("data") or {}
          d = detail.get("attributes", {}) if isinstance(detail, dict) else {}
          missing = [k for k in ("contactFirstName", "contactLastName", "contactPhone", "contactEmail") if not d.get(k)]
          print(f"- Beta App Review contact: {'missing ' + ', '.join(missing) if missing else 'filled in'}")
          for loc in safe("GET", f"/apps/{app_id}/betaAppLocalizations")["data"]:
              la = loc["attributes"]
              print(f"- {la.get('locale')}: description {'set' if la.get('description') else 'MISSING'}, "
                    f"feedback email {'set' if la.get('feedbackEmail') else 'MISSING'}")

          print("\n## Latest builds\n")
          print("| Build | Platform | Uploaded (Apple time zone) | Processing | External state | Beta App Review | External groups |")
          print("|---|---|---|---|---|---|---|")
          response = safe("GET", "/builds", query={
              "filter[app]": app_id, "sort": "-uploadedDate", "limit": 12,
              "include": "preReleaseVersion,buildBetaDetail,betaAppReviewSubmission"})
          included = {(i["type"], i["id"]): i["attributes"] for i in response.get("included", [])}
          def rel(build, name):
              data = build.get("relationships", {}).get(name, {}).get("data")
              return included.get((data["type"], data["id"]), {}) if data else {}
          for build in response["data"]:
              a = build["attributes"]
              version = rel(build, "preReleaseVersion")
              beta = rel(build, "buildBetaDetail")
              review = rel(build, "betaAppReviewSubmission")
              print(f"| {version.get('version', '?')} ({a['version']}) | {version.get('platform', '?')} "
                    f"| {a.get('uploadedDate', '')} | {a.get('processingState')} "
                    f"| {beta.get('externalBuildState', '-')} | {review.get('betaReviewState', '-')} "
                    f"| {', '.join(in_group.get(build['id'], [])) or '-'} |")
          EOF

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
