# Xcode project definition. Generate the project with:  cd apple && xcodegen generate
# The .xcodeproj is not committed. The Team ID is passed at build time (DEVELOPMENT_TEAM).
name: Encave
options:
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    GENERATE_INFOPLIST_FILE: NO
    # iCloud container for syncing away from home, for example iCloud.app.encave.
    # Empty: the iCloud option is hidden. Enabling it is described in docs/development.md.
    ENCAVE_CLOUDKIT_CONTAINER: ""
    # "beta": TestFlight builds, with the beta notices and the sample cellar.
    # "store": an App Store build, without them (read through EncaveChannel, AppChannel.swift).
    ENCAVE_CHANNEL: beta

packages:
  CaveKit:
    path: Packages/CaveKit

targetTemplates:
  App:
    type: application
    sources:
      - path: Encave
        excludes: [Resources/PrivacyInfo.xcprivacy]
      # The privacy manifest, copied into both apps (checked in CI).
      - path: Encave/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: CaveKit
    settings:
      base:
        # One bundle ID for iPhone, iPad and Mac (universal purchase).
        PRODUCT_BUNDLE_IDENTIFIER: app.encave
        PRODUCT_NAME: Encave

targets:
  Encave:
    templates: [App]
    platform: iOS
    # The widgets and the Control Center control, embedded in the app (added to the
    # template's CaveKit dependency).
    dependencies:
      - target: EncaveWidgets
    # The App Group shared with the widget extension: the app writes the widgets' summary
    # there (WidgetPublisher). Also in the archive, signed by CI before the export
    # (.github/workflows/apple.yml, docs/RELEASING.md).
    entitlements:
      path: Generated/Encave.entitlements
      properties:
        com.apple.security.application-groups: [group.app.encave]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    info:
      path: Generated/Info-iOS.plist
      properties:
        CFBundleDisplayName: Encave
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        # Encrypted, with CryptoKit only (the OS's encryption): Apple's value for
        # that case, no documents to upload. See docs/ENCRYPTION.md.
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Encave uses the camera to read wine labels and barcodes, scan documents and scan the pairing code of your other devices. Images stay on your devices unless you turn on AI label recognition, which sends only the label photo to the service you chose.
        NSLocalNetworkUsageDescription: Encave finds your other devices on this network to sync your cellar with them, encrypted from end to end. It also connects to the servers on this network you set up in Settings, such as an AI or web search server or a WebDAV folder.
        NSBonjourServices: [_encave._tcp]
        # encave://pair?code=…: the pairing QR code, scanned with the system camera, opens Join.
        CFBundleURLTypes:
          - CFBundleURLName: app.encave.pair
            CFBundleURLSchemes: [encave]
        # iCloud container for syncing away from home; empty hides the option (docs/development.md).
        EncaveCloudKitContainer: $(ENCAVE_CLOUDKIT_CONTAINER)
        EncaveChannel: $(ENCAVE_CHANNEL)
        # Lets the optional AI recognition reach a server on the local network (OpenWebUI, Ollama).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # A name over plain http (a NAS, a local AI server) is sent to its local IP
          # address (LocalName in CaveKit), so no other exception is needed.
        UILaunchScreen: {}
        UIApplicationSupportsMultipleScenes: true
        # The weekly backup archive is kept in the app's Documents folder, shown by the
        # Files app in On My iPhone › Encave (only archives are written there).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Sync away from home in the background (an app refresh task), when iOS allows.
        UIBackgroundModes: [fetch]
        # A bottle dragged between places of a rack (BottleDrag), a wine dragged onto a
        # storage of the Mac sidebar (WineDrag); their descriptions are
        # translated in InfoPlist.xcstrings (apple/tools/l10n.py).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.encave.bottle
            UTTypeDescription: Encave bottle
            UTTypeConformsTo: [public.data]
          - UTTypeIdentifier: app.encave.wine
            UTTypeDescription: Encave wine
            UTTypeConformsTo: [public.data]
        BGTaskSchedulerPermittedIdentifiers: [app.encave.sync.refresh]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  EncaveMac:
    templates: [App]
    platform: macOS
    entitlements:
      path: Generated/EncaveMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Sync: other devices connect to this Mac on the local network.
        com.apple.security.network.server: true
        # Read for imports, write for backups and exports saved where the user chooses.
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Generated/Info-macOS.plist
      properties:
        CFBundleDisplayName: Encave
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        # Encrypted, with CryptoKit only (the OS's encryption): Apple's value for
        # that case, no documents to upload. See docs/ENCRYPTION.md.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.lifestyle
        EncaveCloudKitContainer: $(ENCAVE_CLOUDKIT_CONTAINER)
        EncaveChannel: $(ENCAVE_CHANNEL)
        NSLocalNetworkUsageDescription: Encave finds your other devices on this network to sync your cellar with them, encrypted from end to end. It also connects to the servers on this network you set up in Settings, such as an AI or web search server or a WebDAV folder.
        NSBonjourServices: [_encave._tcp]
        # encave://pair?code=…: the pairing QR code, scanned with the system camera, opens Join.
        CFBundleURLTypes:
          - CFBundleURLName: app.encave.pair
            CFBundleURLSchemes: [encave]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # A name over plain http (a NAS, a local AI server) is sent to its local IP
          # address (LocalName in CaveKit), so no other exception is needed.
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # A bottle dragged between places of a rack (BottleDrag), a wine dragged onto a
        # storage of the Mac sidebar (WineDrag); their descriptions are
        # translated in InfoPlist.xcstrings (apple/tools/l10n.py).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.encave.bottle
            UTTypeDescription: Encave bottle
            UTTypeConformsTo: [public.data]
          - UTTypeIdentifier: app.encave.wine
            UTTypeDescription: Encave wine
            UTTypeConformsTo: [public.data]

  # Home screen and lock screen widgets, and the Control Center control (iPhone and iPad).
  # They read only the summary the app writes to the App Group (CaveKit WidgetSnapshot).
  EncaveWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: EncaveWidgets
        excludes: [Resources/PrivacyInfo.xcprivacy]
      - path: EncaveWidgets/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Shared with the app: maturity words, symbols and colors, and the Add Bottles
      # intent of the control (its perform runs in the app, see WIDGET_EXTENSION).
      - path: Encave/DesignSystem/Maturity+UI.swift
      - path: Encave/App/AddBottleIntent.swift
    dependencies:
      - package: CaveKit
    entitlements:
      path: Generated/EncaveWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.app.encave]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.encave.widgets
        PRODUCT_NAME: EncaveWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        # Its own catalog holds colors only (design/generate_apple_assets.py), no app icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) WIDGET_EXTENSION
    info:
      path: Generated/Info-Widgets.plist
      properties:
        CFBundleDisplayName: Encave
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Screen tour with screenshots and layout checks (see EncaveUITests).
  EncaveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EncaveUITests
    dependencies:
      - target: Encave
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.encave.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: Encave

  EncaveMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: EncaveUITests
    dependencies:
      - target: EncaveMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.encave.macuitests
        TEST_TARGET_NAME: EncaveMac

schemes:
  Encave:
    build:
      targets:
        Encave: all
    test:
      targets:
        - EncaveUITests
    archive:
      config: Release
  EncaveMac:
    build:
      targets:
        EncaveMac: all
    test:
      targets:
        - EncaveMacUITests
    archive:
      config: Release
