# Xcode project definition. Generate the project with:  cd apple && xcodegen generate
# The .xcodeproj is not committed. The Team ID is passed at build time (DEVELOPMENT_TEAM).
name: Encave
options:
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    GENERATE_INFOPLIST_FILE: NO
    # iCloud container for syncing away from home, for example iCloud.app.encave.
    # Empty: the iCloud option is hidden. Enabling it is described in docs/development.md.
    ENCAVE_CLOUDKIT_CONTAINER: ""

packages:
  CaveKit:
    path: Packages/CaveKit

targetTemplates:
  App:
    type: application
    sources:
      - path: Encave
    dependencies:
      - package: CaveKit
    settings:
      base:
        # One bundle ID for iPhone, iPad and Mac (universal purchase).
        PRODUCT_BUNDLE_IDENTIFIER: app.encave
        PRODUCT_NAME: Encave

targets:
  Encave:
    templates: [App]
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    info:
      path: Generated/Info-iOS.plist
      properties:
        CFBundleDisplayName: Encave
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Encave uses the camera to read wine labels. Images stay on this device.
        NSLocalNetworkUsageDescription: Encave finds your other devices on this network to sync your cellar, encrypted from end to end. It also reaches the AI server you may set in Settings.
        NSBonjourServices: [_encave._tcp]
        # iCloud container for syncing away from home; empty hides the option (docs/development.md).
        EncaveCloudKitContainer: $(ENCAVE_CLOUDKIT_CONTAINER)
        # Lets the optional AI recognition reach a server on the local network (OpenWebUI, Ollama).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # Home-network names (RFC 8375), which local networking alone does not cover:
          # a NAS or local AI server reached over plain HTTP, as the app allows.
          NSExceptionDomains:
            home.arpa:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        UILaunchScreen: {}
        UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  EncaveMac:
    templates: [App]
    platform: macOS
    entitlements:
      path: Generated/EncaveMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Sync: other devices connect to this Mac on the local network.
        com.apple.security.network.server: true
        # Read for imports, write for backups and exports saved where the user chooses.
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Generated/Info-macOS.plist
      properties:
        CFBundleDisplayName: Encave
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.lifestyle
        EncaveCloudKitContainer: $(ENCAVE_CLOUDKIT_CONTAINER)
        NSLocalNetworkUsageDescription: Encave finds your other devices on this network to sync your cellar, encrypted from end to end. It also reaches the AI server you may set in Settings.
        NSBonjourServices: [_encave._tcp]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # Home-network names (RFC 8375), which local networking alone does not cover:
          # a NAS or local AI server reached over plain HTTP, as the app allows.
          NSExceptionDomains:
            home.arpa:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)

  # Screen tour with screenshots and layout checks (see EncaveUITests).
  EncaveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: EncaveUITests
    dependencies:
      - target: Encave
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.encave.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: Encave

  EncaveMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: EncaveUITests
    dependencies:
      - target: EncaveMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.encave.macuitests
        TEST_TARGET_NAME: EncaveMac

schemes:
  Encave:
    build:
      targets:
        Encave: all
    test:
      targets:
        - EncaveUITests
    archive:
      config: Release
  EncaveMac:
    build:
      targets:
        EncaveMac: all
    test:
      targets:
        - EncaveMacUITests
    archive:
      config: Release
