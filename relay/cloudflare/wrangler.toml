# Encave relay on Cloudflare Workers. Before deploying:
#   npx wrangler r2 bucket create encave-relay
#   npx wrangler deploy --config relay/cloudflare/wrangler.toml
# For a private relay, also: npx wrangler secret put RELAY_ACCESS_KEY --config relay/cloudflare/wrangler.toml
name = "encave-relay"
main = "worker.mjs"
compatibility_date = "2026-09-01"

# Every 15 minutes, the clean-up carries on (at most 45 R2 calls a run, under the
# Free plan's 50): it deletes mailboxes not written to for TTL_DAYS and counts
# the relay's totals for MAX_STORAGE_MB and MAX_MAILBOXES.
[triggers]
crons = ["*/15 * * * *"]

[vars]
TTL_DAYS = "365"
# The whole relay, under R2's 10 GB free storage.
MAX_STORAGE_MB = "9000"
MAX_MAILBOXES = "1000"

[[r2_buckets]]
binding = "FILES"
bucket_name = "encave-relay"

# Requests per minute per client (IPv4 address or IPv6 /64). If your account
# refuses this binding when deploying, delete these lines: the relay then runs
# without a rate limit (see relay/README.md).
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 300
  period = 60
