# Encave relay on Cloudflare Workers. Before deploying:
#   npx wrangler r2 bucket create encave-relay
#   npx wrangler deploy --config relay/cloudflare/wrangler.toml
name = "encave-relay"
main = "worker.mjs"
compatibility_date = "2026-09-01"

# Once a day, delete mailboxes not written to for TTL_DAYS.
[triggers]
crons = ["17 3 * * *"]

[vars]
TTL_DAYS = "365"

[[r2_buckets]]
binding = "FILES"
bucket_name = "encave-relay"

# Optional: requests per minute per client.
# [[ratelimits]]
# name = "RATE_LIMITER"
# namespace_id = "1001"
# simple = { limit = 300, period = 60 }
